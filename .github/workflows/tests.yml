name: Reliability checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_v05*.py' -v
      - run: python tests/test_geom2d.py
      - run: python -m unittest tests.test_pattern_mirror -v
      - run: python -m unittest tests.test_text_boxes -v
      - name: Synthetic dataset, dimension association and pose-free scoring
        run: python -m unittest tests.test_dataset -v
      - run: python scripts/package_skill.py -o dist/drawing2sw.zip
      - uses: actions/upload-artifact@v4
        with:
          name: drawing2sw-skill
          path: dist/drawing2sw.zip

  skill-security:
    # NVIDIA SkillSpector: static scan of the packaged skill for prompt injection, exfiltration,
    # excessive agency and dangerous code. Runs without an LLM. Its SC4 check sends dependency
    # names and versions to api.osv.dev.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/package_skill.py -o dist/drawing2sw.zip
      - run: pip install "git+https://github.com/NVIDIA/skillspector.git"
      - run: |
          cd dist && python -m zipfile -e drawing2sw.zip .
          skillspector scan drawing2sw/ --no-llm --format markdown --output ../skillspector-report.md || echo "exit=$?"
      - if: always()
        run: cat skillspector-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skillspector-report
          path: skillspector-report.md
